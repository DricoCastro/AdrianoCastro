name: Bug report
description: Report a bug
title: "[BUG] "
labels: bug
assignees: ''

body:
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "Selecione o tamanho do issue"
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true

  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      description: "Selecione a prioridade do issue"
      options:
        - "1"
        - "3"
        - "5"
    validations:
      required: true
